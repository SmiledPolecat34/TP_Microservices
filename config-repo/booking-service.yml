server:
  port: 8092
spring:
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
booking:
  payment-deadline-minutes: 60
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        # Les refus métier (404/409) ne doivent pas ouvrir le circuit
        ignore-exceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$Conflict
          - feign.FeignException$BadRequest
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
