server:
  port: 8091
spring:
  datasource:
    url: jdbc:h2:mem:classdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
